name: Error
description: Algo que no funciona como debería
labels: ["tipo:bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Qué pasa en realidad
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: producción / desarrollo, navegador, rol del usuario
